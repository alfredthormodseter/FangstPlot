<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>FangstPlot</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="crossorigin=""></script>
    <style>
        #map { height: 800px; width: 600px }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
</head>
<body>

    <h1>FangstPlot</h1>
    <div id="result"></div>
    <div id="map"></div>
    <script type="text/javascript">
        var map = L.map('map').setView([60.14,10.25],9);
        L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topograatone/default/webmercator/{z}/{y}/{x}.png', {
        attribution: '&copy; <a href="http://www.kartverket.no/">Kartverket</a>'
        }).addTo(map);

        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var drawControl = new L.Control.Draw({
            edit: {
                featureGroup: drawnItems,
                edit: false,
                remove: false
            },
            draw: {
                polygon: true,
                polyline: false,
                rectangle: false,
                circle: false,
                marker: false,
                circlemarker: false
            }
        });
        map.addControl(drawControl);

        map.on('draw:created', function(e) {
            var layer = e.layer;
            drawnItems.addLayer(layer);

            // Hent GeoJSON frå mangekanten
            var geoJson = layer.toGeoJSON();
            console.log(geoJson);

            // Send til backend (seinare)
        });

        map.on('draw:created', function(e) {
            var layer = e.layer;
            drawnItems.addLayer(layer);

            var geoJson = layer.toGeoJSON();
            console.log(geoJson);

            // Send til backend
            fetch('/create-grid', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    coordinates: geoJson.geometry.coordinates
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Grids:', data.grids);
                document.getElementById('result').innerText = `Grids created: ${data.grids.length}`;
            });
        });
    </script>
</body>
</html>
